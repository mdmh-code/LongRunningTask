version: '3.9'
services:
  auth:
    image: nginx:alpine
    container_name: authentication-service
    hostname: auth
    ports:
      - "5173:80"
    volumes:
      - ./LongRunningTask.Authentication/nginx.conf:/etc/nginx/nginx.conf
      - ./LongRunningTask.Authentication/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - web
    networks:
      - ltrnet
  web:
    build:
      context: .
      dockerfile: LongRunningTask.WebApp/Dockerfile
    container_name: web-service
    hostname: web
    ports:
      - "5173"
    depends_on:
      - api
    networks:
      - ltrnet

  background_processor:
    build:
      context: .
      dockerfile: LongRunningTask.Processor/Dockerfile
    container_name: background-processor-service
    hostname: background_processor
    ports:
      - "9090:8080"
      - "9091:8081"
    depends_on:
      queues:
        condition: service_healthy
    networks:
      - ltrnet

  api:
    build:
      context: .
      dockerfile: LongRunningTask.API/Dockerfile
    container_name: api-service
    hostname: api
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      queues:
        condition: service_healthy
    networks:
      - ltrnet

  queues:
    image: masstransit/rabbitmq
    container_name: queues-service
    hostname: queues
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ltrnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  postgres:
    image: postgres:16
    container_name: database-service
    hostname: database-service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: JobsDb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./LongRunningTask.Processor/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - ltrnet
volumes:
  pg_data:

networks:
  ltrnet:
    driver: bridge
  

  